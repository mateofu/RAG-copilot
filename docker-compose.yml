services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag_copilot
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    command: ["pull", "bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy

  ollama-chat-model:
    image: ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    command: ["pull", "qwen2.5:1.5b"]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      RAG_COPILOT_DOCUMENT_STORAGE_PATH: /app/data/documents
      RAG_COPILOT_OLLAMA_BASE_URL: http://ollama:11434
      RAG_COPILOT_EMBEDDING_PROVIDER: ${RAG_COPILOT_EMBEDDING_PROVIDER:-ollama}
    ports:
      - "8000:8000"
    volumes:
      - document_storage_v2:/app/data/documents
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama-model:
        condition: service_completed_successfully
      ollama-chat-model:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      RAG_COPILOT_DOCUMENT_STORAGE_PATH: /app/data/documents
      RAG_COPILOT_OLLAMA_BASE_URL: http://ollama:11434
      RAG_COPILOT_EMBEDDING_PROVIDER: ${RAG_COPILOT_EMBEDDING_PROVIDER:-ollama}
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.infrastructure.task_queue.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    volumes:
      - document_storage_v2:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama-model:
        condition: service_completed_successfully

  scheduler:
    build: ./backend
    env_file: ./backend/.env
    environment:
      RAG_COPILOT_DOCUMENT_STORAGE_PATH: /app/data/documents
      RAG_COPILOT_OLLAMA_BASE_URL: http://ollama:11434
      RAG_COPILOT_EMBEDDING_PROVIDER: ${RAG_COPILOT_EMBEDDING_PROVIDER:-ollama}
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.infrastructure.task_queue.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  document_storage_v2:
  ollama_data:
